<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Usuários — BiblioLivre</title>
    <link rel="shortcut icon" href="../images/userFavicon.png" type="image/x-icon">
    <link rel="stylesheet" href="loginCadastro.css">
    <link rel="stylesheet" href="gerenciarUsuarios.css">
</head>
<body class="pagina-gerenciar">

    <!-- ── NAVBAR ─────────────────────────────────────────────────── -->
    <header>
        <nav class="header-box-gerenciar">
            <h1><span class="bookEmoji">📖</span>Biblio<span class="libre">Livre</span></h1>
            <div class="nav-links-gerenciar">
                <a href="../index.html">← Voltar ao Início</a>
            </div>
        </nav>
    </header>

    <!-- ── CONTEÚDO PRINCIPAL ─────────────────────────────────────── -->
    <main class="gerenciar-main">

        <div class="gerenciar-header">
            <div>
                <h2>Gerenciar Usuários</h2>
                <p class="subtitulo">Cadastros armazenados localmente no navegador</p>
            </div>
            <a href="telaCadastro.html" class="btn-novo">+ Novo Usuário</a>
        </div>

        <!-- Tabela de usuários -->
        <div class="tabela-wrapper">
            <table class="tabela-usuarios">
                <thead>
                    <tr>
                        <th>CPF</th>
                        <th>Nome completo</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-usuarios">
                    <!-- Preenchido via JavaScript -->
                </tbody>
            </table>

            <!-- Estado vazio -->
            <div id="estado-vazio" class="estado-vazio" style="display:none">
                <span class="vazio-emoji">📭</span>
                <p>Nenhum usuário cadastrado ainda.</p>
                <a href="telaCadastro.html" class="btn-novo">Cadastrar primeiro usuário</a>
            </div>
        </div>

    </main>

    <!-- ── MODAL DE EDIÇÃO ─────────────────────────────────────────── -->
    <div id="modal-edicao" class="modal-overlay" style="display:none">
        <div class="modal">
            <div class="modal-header">
                <h3>Editar Usuário</h3>
                <button class="modal-fechar" onclick="fecharEdicao()">✕</button>
            </div>

            <!-- index oculto para saber qual usuário editar -->
            <input type="hidden" id="edit-index">

            <form onsubmit="return false" class="modal-form">

                <label for="edit-cpf">CPF</label>
                <!-- CPF não é editável: é a chave única do usuário -->
                <input id="edit-cpf" type="text" disabled>

                <label for="edit-firstname">Primeiro Nome</label>
                <input id="edit-firstname" type="text" placeholder="Primeiro nome" required>

                <label for="edit-lastname">Sobrenome</label>
                <input id="edit-lastname" type="text" placeholder="Sobrenome" required>

                <label for="edit-password">Nova Senha <span class="label-opcional">(deixe em branco para manter)</span></label>
                <input id="edit-password" type="password" placeholder="Mínimo 6 caracteres">

                <div class="modal-acoes">
                    <button type="button" class="btn-cancelar" onclick="fecharEdicao()">Cancelar</button>
                    <button type="button" class="btn-salvar" onclick="salvarEdicao()">Salvar alterações</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../javascript.js"></script>
    <script>
        // Renderiza a tabela assim que a página carrega
        document.addEventListener('DOMContentLoaded', renderizarTabela);

        // Fecha o modal clicando fora dele
        document.getElementById('modal-edicao').addEventListener('click', function(e) {
            if (e.target === this) fecharEdicao();
        });
    </script>
</body>
</html>
