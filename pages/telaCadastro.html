<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro — BiblioLivre</title>
    <link rel="shortcut icon" href="../images/userFavicon.png" type="image/x-icon">
    <link rel="stylesheet" href="loginCadastro.css">
</head>
<body>
    <div class="container">
        <div class="form-image">
            <img src="../images/drDoomStudying.png" alt="Ilustração de pessoa estudando">
        </div>

        <div class="form">
            <div class="form-header">
                <div class="title">
                    <h1>Cadastre-se</h1>
                </div>
            </div>

            <form onsubmit="return false">
                <div class="input-group">
                    <div class="input-box">

                        <label for="cpf">CPF</label>
                        <input
                            oninput="formatarCPF(this)"
                            id="cpf"
                            type="text"
                            maxlength="14"
                            name="cpf"
                            placeholder="000.000.000-00"
                            autocomplete="off"
                            required>

                        <label for="firstname">Primeiro Nome</label>
                        <input
                            id="firstname"
                            type="text"
                            name="firstname"
                            placeholder="Digite seu primeiro nome"
                            required>

                        <label for="lastname">Sobrenome</label>
                        <input
                            id="lastname"
                            type="text"
                            name="lastname"
                            placeholder="Digite seu sobrenome"
                            required>

                        <label for="password">Senha</label>
                        <input
                            id="password"
                            type="password"
                            name="password"
                            placeholder="Mínimo 6 caracteres"
                            required>

                        <label for="confirm-password">Confirmar Senha</label>
                        <input
                            id="confirm-password"
                            type="password"
                            name="confirm-password"
                            placeholder="Repita sua senha"
                            required>

                    </div>
                </div>

                <div class="continue-button">
                    <button type="button" onclick="cadastrar()">Continuar</button>
                </div>
            </form>

            <p class="link-cadastro">Já possui cadastro? <a href="telaLogin.html">Entrar</a></p>
        </div>
    </div>
    <script src="../javascript.js"></script>
</body>
</html>
